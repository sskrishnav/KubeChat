# Default values for the kubechat chart. Install it into its own namespace:
#   helm upgrade --install kubechat deploy/helm/kubechat -n kubechat --create-namespace

# -- Kubernetes MCP server (official chart, aliased "mcp").
# Everything under mcp: is passed to that chart; see its values.yaml for all options.
mcp:
  nameOverride: kubechat-mcp       # stable pod labels (used by templates/mcp-nodeport.yaml)
  fullnameOverride: kubechat-mcp   # stable names: Deployment, Service, ServiceAccount
  ingress:
    enabled: false                 # the upstream default is on; KubeChat needs no ingress

  # Rendered into the server's config.toml. Tool names and hints: docs/tools.md.
  config:
    port: "{{ .Values.service.port }}"
    toolsets: ["core"]
    enabled_tools:
      # read: run at once
      - pods_list_in_namespace
      - pods_get
      - pods_log
      - events_list
      - resources_list
      - resources_get
      # write: KubeChat runs it only after a human clicks Approve
      - resources_scale
    denied_resources:
      - { group: "", version: "v1", kind: "Secret" }

  # What the server's ServiceAccount may do, enforced by Kubernetes.
  # Reads: almost everything ("view" excludes Secrets). Writes: scale deployments
  # in any namespace. The bot refuses protected namespaces (bot.env
  # KUBECHAT_PROTECTED_NAMESPACES) and asks a human before every other change.
  rbac:
    extraClusterRoles:
      - name: scale
        rules:
          - apiGroups: ["apps"]
            resources: ["deployments", "deployments/scale"]
            verbs: ["get", "patch", "update"]
    extraClusterRoleBindings:
      - name: view
        roleRef: { name: view, external: true }
      - name: scale
        roleRef: { name: scale }

# -- The KubeChat bot.
bot:
  enabled: true
  image:
    repository: ghcr.io/sskrishnav/kubechat # not published yet; kind uses a local build (values-kind.yaml)
    tag: ""                                 # defaults to the chart's appVersion
    pullPolicy: IfNotPresent
  # Settings, passed as environment variables (read by internal/config).
  env:
    KUBECHAT_LLM_BASE_URL: http://host.docker.internal:11434/v1 # Ollama on the host (Docker Desktop)
    KUBECHAT_LLM_MODEL: qwen3:8b
    KUBECHAT_MAX_TOOL_ROUNDS: "8"
    KUBECHAT_MCP_URL: http://kubechat-mcp:8080/mcp
    KUBECHAT_PROTECTED_NAMESPACES: "kube-*,kubechat" # never changed; kubechat = the bot's own namespace
    KUBECHAT_TOOL_TIERS: resources_scale=write # the server marks it destructive; the MVP treats it as a write
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# -- Dev only: expose the MCP server on a fixed NodePort so KubeChat running on
# the laptop (go run) can reach it. kind maps this port to localhost; see
# values-kind.yaml and deploy/kind/launch.sh. Keep it off on real clusters.
mcpNodePort:
  enabled: false
  nodePort: 30080
