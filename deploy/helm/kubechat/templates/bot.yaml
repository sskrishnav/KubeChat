{{- if .Values.bot.enabled }}
# The bot's settings, passed to it as environment variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bot
data:
  {{- range $key, $value := .Values.bot.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-bot
  labels:
    app.kubernetes.io/name: kubechat-bot
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1 # one Slack connection, state in memory
  selector:
    matchLabels:
      app.kubernetes.io/name: kubechat-bot
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubechat-bot
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/env: {{ toJson .Values.bot.env | sha256sum }} # restart when settings change
    spec:
      # The bot has no Kubernetes permissions: it reaches the cluster only
      # through the MCP server, so it gets no ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bot
          image: "{{ .Values.bot.image.repository }}:{{ .Values.bot.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.bot.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-bot
            - secretRef: # Slack tokens, added in step 7
                name: {{ .Release.Name }}-slack
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.bot.resources | nindent 12 }}
{{- end }}
